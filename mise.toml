[tools]
node = "26.12.0"
pnpm = "12.13.0"
gitleaks = "8.30.1"

[tasks.setup]
description = "Install dependencies and configure repository hooks"
run = [
  "pnpm install --frozen-lockfile",
  "git config core.hooksPath .githooks",
]

[tasks.lint]
description = "Check formatting and lint rules with Biome"
run = '''
report_file="$(mktemp)"
trap 'rm -f "$report_file"' EXIT HUP INT TERM
if pnpm exec biome ci . --reporter=json > "$report_file"; then
  node scripts/gate/count-biome.mjs < "$report_file"
else
  # Re-run with the default reporter so failures are readable instead of raw JSON.
  pnpm exec biome ci .
  exit 1
fi
'''

[tasks."lint:fix"]
description = "Apply safe formatting and lint fixes with Biome"
run = "pnpm exec biome check --write ."

[tasks.typecheck]
description = "Type-check all workspaces"
run = '''
pnpm exec turbo run typecheck
report_file="$(mktemp)"
trap 'rm -f "$report_file"' EXIT HUP INT TERM
for config in tsconfig.json packages/*/tsconfig.json apps/*/tsconfig.json; do
  [ -f "$config" ] || continue
  printf '::tsconfig::%s\n' "$config" >> "$report_file"
  pnpm exec tsc -p "$config" --noEmit --listFilesOnly >> "$report_file"
done
node scripts/gate/count-tsc.mjs < "$report_file"
'''

[tasks.test]
description = "Run deterministic mock-mode tests"
env = { AI_TEST_RUN_MODE = "mock", AI_TEST_SUITE = "gate" }
run = "pnpm exec turbo run test"

[tasks."test:local"]
description = "Run local-model comparison and quality tests"
env = { AI_TEST_RUN_MODE = "local", AI_TEST_SUITE = "local" }
run = "pnpm exec turbo run test"

[tasks."test:db"]
description = "Start Postgres and run Docker-backed database tests"
depends = ["services:up:db"]
env = { AI_TEST_RUN_MODE = "mock", AI_TEST_SUITE = "pg" }
run = "pnpm exec turbo run test"

[tasks."test:container"]
description = "Run Docker-backed sandbox tests (skipped with a reason when Docker is unreachable)"
env = { AI_TEST_RUN_MODE = "mock", AI_TEST_SUITE = "container" }
# Only @platform/ai-core has container tests, so the other workspaces' configs need no such suite.
run = "pnpm --filter @platform/ai-core run test"

[tasks."e2e:fixtures"]
description = "Regenerate the E2E SSE fixtures from the Route Handlers in mock mode"
env = { SSE_FIXTURES = "write", AI_TEST_RUN_MODE = "mock", AI_TEST_SUITE = "gate" }
run = "pnpm --filter web exec vitest run app/api -t 'generated SSE fixture'"

[tasks."test:e2e"]
description = "Run Playwright tests in Chromium, Firefox, and WebKit"
# CI runs one engine per matrix job through E2E_PROJECTS (comma-separated); the default is all three.
run = """
projects="${E2E_PROJECTS:-chromium,firefox,webkit}"
flags=""
for project in $(echo "$projects" | tr ',' ' '); do flags="$flags --project=$project"; done
pnpm --filter web exec playwright test $flags
node scripts/gate/assert-playwright-nonempty.mjs --projects "$projects" < apps/web/test-results/results.json
"""

[tasks."test:mutation"]
description = "Run mutation tests"
run = "pnpm exec stryker run"

[tasks."test:coverage"]
description = "Generate workspace coverage reports"
env = { AI_TEST_RUN_MODE = "mock", AI_TEST_SUITE = "gate" }
run = "pnpm exec turbo run test:coverage"

[tasks.gate]
description = "Run the deterministic quality gate"
run = [
  "mise run lint",
  "mise run check:model-ids",
  "mise run check:repo-rules",
  "mise run typecheck",
  "mise run test",
  "mise run docs:check",
]

[tasks."gate:repeat"]
description = "Run the quality gate ten times to check determinism"
# Bypass the Turborepo cache so every run executes the tests instead of replaying logs.
env = { TURBO_FORCE = "true" }
run = '''
for run_number in $(seq 1 10); do
  echo "gate run ${run_number}/10"
  mise run gate
done
'''

[tasks."secret-scan"]
description = "Scan repository history for secrets"
run = "gitleaks git --redact"

[tasks."secret-scan:staged"]
description = "Scan staged changes for secrets"
run = "gitleaks git --staged --redact"

[tasks.audit]
description = "Audit dependencies for moderate-or-higher vulnerabilities"
run = "pnpm audit --audit-level=moderate"

[tasks.outdated]
description = "Report outdated dependencies and prerelease updates"
run = '''
status=0
pnpm outdated || status=$?
node scripts/check-updates.mjs || status=$?
exit "$status"
'''

[tasks."services:up"]
description = "Start database and tracing services and wait until they are healthy"
run = '''
set --
if [ -f .env.local ]; then set -- --env-file .env.local; fi
docker compose "$@" --profile db --profile trace up -d --wait
'''

[tasks."services:up:db"]
description = "Start the database service and wait until it is healthy"
run = '''
set --
if [ -f .env.local ]; then set -- --env-file .env.local; fi
docker compose "$@" --profile db up -d --wait
'''

[tasks."services:down"]
description = "Stop local dependency services"
run = '''
set --
if [ -f .env.local ]; then set -- --env-file .env.local; fi
docker compose "$@" --profile db --profile trace down
'''

# Next.js reads env files only from apps/web, so the root .env.local is loaded here. Node's
# --env-file-if-exists keeps variables already set in the shell (as Next.js does) but, unlike
# Next.js, does not expand ${VAR} references. mise forwards Ctrl-C (SIGINT) to the task, which
# reaches pnpm and next dev; a SIGTERM sent to this wrapper alone does not reach them.
[tasks.dev]
description = "Run the web app (next dev) with the root .env.local"
run = '''
exec node --env-file-if-exists=.env.local --input-type=module -e 'import { spawnSync } from "node:child_process"; const run = spawnSync("pnpm", ["--filter", "web", "dev"], { stdio: "inherit" }); if (run.error) console.error(`mise run dev: could not start pnpm: ${run.error.message}`); else if (run.signal) console.error(`mise run dev: pnpm ended by ${run.signal}`); process.exitCode = run.status ?? 1;'
'''

[tasks.record]
description = "Run the web app with cassette recording enabled and the root .env.local"
env = { AI_RECORD = "1" }
run = "mise run dev"

[tasks."docs:check"]
description = "Validate curriculum module documentation"
run = "node scripts/check-docs.mjs"

[tasks."check:model-ids"]
description = "Validate model ID centralization rules"
run = "node scripts/check-model-ids.mjs"

[tasks."check:client-bundle"]
description = "Build the web app with sentinel secrets and check the client bundle for them"
env = { AI_RUN_MODE = "mock", NODE_ENV = "production", ANTHROPIC_API_KEY = "changeme-bundle-sentinel-anthropic", TAVILY_API_KEY = "changeme-bundle-sentinel-tavily", COHERE_API_KEY = "changeme-bundle-sentinel-cohere", E2B_API_KEY = "changeme-bundle-sentinel-e2b", GITHUB_TOKEN = "changeme-bundle-sentinel-github" }
run = """
pnpm --filter web exec next build
node scripts/check-client-bundle.mjs --dir apps/web/.next/static --sentinel changeme-bundle-sentinel-anthropic --sentinel changeme-bundle-sentinel-tavily --sentinel changeme-bundle-sentinel-cohere --sentinel changeme-bundle-sentinel-e2b --sentinel changeme-bundle-sentinel-github
"""

[tasks."check:repo-rules"]
description = "Validate repository governance rules"
run = "node scripts/check-repo-rules.mjs --only no-dynamic-eval,actions-pinned,frozen-lockfile,allow-builds-reasoned,no-deprecated-object-api,guarded-agent-only,ai-core-no-ui-deps,no-sensitive-logging,tool-risk-declared,no-sql-raw,workflow-no-agent-loop"
