name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same pull request; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Quality gate
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise and toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.9.14
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup
      - name: Run quality gate
        run: mise run gate

  secret-scan:
    name: Secret scan
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install mise and toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.9.14
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup
      - name: Scan Git history
        run: mise run secret-scan

  audit:
    name: Dependency audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise and toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.9.14
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup
      - name: Audit dependencies
        run: mise run audit

  mutation:
    name: Mutation tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise and toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.9.14
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup
      - name: Run mutation tests
        run: mise run test:mutation

  e2e:
    name: E2E (${{ matrix.browser }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise and toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.9.14
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup
      - name: Install browser
        run: pnpm --filter web exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E tests
        env:
          E2E_PROJECTS: ${{ matrix.browser }}
        run: mise run test:e2e
      # Traces (network, console, DOM snapshots) of failed tests; the E2E flake seen only on WebKit
      # in CI cannot be diagnosed from the log alone.
      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.browser }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  client-bundle:
    name: Client bundle check
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install mise and toolchain
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.9.14
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup
      - name: Build and scan the client bundle with sentinel secrets
        run: mise run check:client-bundle

  ci-status:
    name: CI status
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [gate, e2e, secret-scan, audit, mutation, client-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          CLIENT_BUNDLE_RESULT: ${{ needs.client-bundle.result }}
        run: |
          test "$GATE_RESULT" = "success"
          test "$E2E_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$AUDIT_RESULT" = "success"
          test "$MUTATION_RESULT" = "success"
          test "$CLIENT_BUNDLE_RESULT" = "success"
