name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same pull request; never cancel runs on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Quality gate
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install mise and toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.9.14
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup
      - name: Run quality gate
        run: mise run gate

  secret-scan:
    name: Secret scan
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install mise and toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.9.14
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup
      - name: Scan Git history
        run: mise run secret-scan

  audit:
    name: Dependency audit
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install mise and toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.9.14
          install: true
          cache: true
      - name: Install dependencies
        run: mise run setup
      - name: Audit dependencies
        run: mise run audit

  ci-status:
    name: CI status
    timeout-minutes: 5
    if: ${{ always() }}
    needs: [gate, secret-scan, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to succeed
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
        run: |
          test "$GATE_RESULT" = "success"
          test "$SECRET_SCAN_RESULT" = "success"
          test "$AUDIT_RESULT" = "success"
