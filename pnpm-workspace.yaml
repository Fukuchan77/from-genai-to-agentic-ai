packages:
  - "apps/*"
  - "packages/*"

# Do not resolve releases published less than 24 hours ago.
minimumReleaseAge: 1440

allowBuilds:
  # Biome 2.5.14 ships prebuilt platform packages and requires no lifecycle script.
  "@biomejs/biome": false

overrides:
  # typed-rest-client 2.3.1 (via @stryker-mutator/core 10.0.0) pins qs 6.15.1, which is affected by
  # GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g, and (up to 6.16.0)
  # GHSA-6pq8-jhm2-2vcw. Remove once Stryker ships a typed-rest-client release that depends on
  # qs >=6.16.1.
  "typed-rest-client>qs": "^6.16.1"

# @stryker-mutator/vitest-runner 10.0.0 joins suite and test names with a space when it builds the
# per-mutant testNamePattern, but Vitest 5 matches the pattern against "suite > test". Every
# filtered mutant run then executes zero tests and every non-static mutant survives. The patch joins
# with " > " in both places that build test names. Remove once Stryker supports Vitest 5.
patchedDependencies:
  '@stryker-mutator/vitest-runner@10.0.0': patches/@stryker-mutator__vitest-runner@10.0.0.patch
